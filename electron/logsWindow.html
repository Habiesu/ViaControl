<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>ViaControl — Visor de Logs del Sistema</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #080d1a;
      color: #94a3b8;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      line-height: 1.6;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: text;
    }
    header {
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-family: 'Inter', sans-serif;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .live-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 10px #10b981;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    h1 {
      font-size: 13px;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: 0.5px;
    }
    .badge {
      background: #1e293b;
      color: #38bdf8;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    input[type="text"] {
      background: #080d1a;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 12px;
      outline: none;
      width: 170px;
      font-family: 'Inter', sans-serif;
    }
    input[type="text"]:focus {
      border-color: #38bdf8;
    }
    select {
      background: #080d1a;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 5px 8px;
      border-radius: 5px;
      font-size: 12px;
      outline: none;
      font-family: 'Inter', sans-serif;
    }
    button {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      padding: 5px 12px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.15s, border-color 0.15s;
      font-family: 'Inter', sans-serif;
    }
    button:hover {
      background: #334155;
      border-color: #64748b;
    }
    .btn-clear {
      color: #f87171;
    }
    .btn-clear:hover {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.4);
    }
    .auto-scroll-label {
      display: flex;
      align-items: center;
      gap: 5px;
      color: #94a3b8;
      font-size: 11.5px;
      cursor: pointer;
      user-select: none;
    }
    #log-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      background: #080d1a;
    }
    .log-line {
      padding: 2px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      word-break: break-all;
      display: flex;
      gap: 8px;
    }
    .log-time {
      color: #475569;
      flex-shrink: 0;
    }
    .log-tag {
      font-weight: 600;
      flex-shrink: 0;
      padding: 0 4px;
      border-radius: 3px;
    }
    .tag-info { color: #38bdf8; }
    .tag-warn { color: #facc15; }
    .tag-error { color: #f87171; background: rgba(239, 68, 68, 0.1); }
    .tag-sync { color: #34d399; }
    .log-msg {
      color: #cbd5e1;
      white-space: pre-wrap;
    }
    .log-msg.error { color: #fca5a5; }
    .log-msg.warn { color: #fde047; }
    #empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #475569;
      font-style: italic;
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <div class="live-dot" title="Transmisión en vivo activa"></div>
      <h1>ViaControl Terminal Logs</h1>
      <span class="badge" id="log-counter">0 logs</span>
    </div>
    <div class="controls">
      <input type="text" id="search-input" placeholder="Buscar en logs…" />
      <select id="level-filter">
        <option value="all">Todos los niveles</option>
        <option value="info">Info</option>
        <option value="warn">Advertencias</option>
        <option value="error">Errores</option>
      </select>
      <label class="auto-scroll-label">
        <input type="checkbox" id="auto-scroll-check" checked /> Auto-scroll
      </label>
      <button id="copy-btn" title="Copiar todos los logs visibles">Copiar</button>
      <button class="btn-clear" id="clear-btn" title="Limpiar la consola">Limpiar</button>
    </div>
  </header>

  <div id="log-container">
    <div id="empty-state">Iniciando captura de eventos en tiempo real…</div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const container = document.getElementById('log-container');
    const counter = document.getElementById('log-counter');
    const searchInput = document.getElementById('search-input');
    const levelFilter = document.getElementById('level-filter');
    const autoScrollCheck = document.getElementById('auto-scroll-check');
    const clearBtn = document.getElementById('clear-btn');
    const copyBtn = document.getElementById('copy-btn');

    let allLogs = [];

    function renderLogs() {
      const query = (searchInput.value || '').toLowerCase();
      const level = levelFilter.value;

      const filtered = allLogs.filter(item => {
        if (level !== 'all' && item.level !== level) return false;
        if (query && !item.msg.toLowerCase().includes(query) && !item.time.toLowerCase().includes(query)) return false;
        return true;
      });

      counter.textContent = `${filtered.length} logs`;

      if (filtered.length === 0) {
        container.innerHTML = '<div id="empty-state">No hay registros que coincidan con los filtros.</div>';
        return;
      }

      container.innerHTML = '';
      filtered.forEach(item => {
        const div = document.createElement('div');
        div.className = 'log-line';

        const tagClass = item.msg.includes('[SyncEngine]') ? 'tag-sync' :
                         item.level === 'error' ? 'tag-error' :
                         item.level === 'warn' ? 'tag-warn' : 'tag-info';

        const tagText = item.msg.includes('[SyncEngine]') ? '[SYNC]' : `[${item.level.toUpperCase()}]`;

        div.innerHTML = `
          <span class="log-time">${item.time}</span>
          <span class="log-tag ${tagClass}">${tagText}</span>
          <span class="log-msg ${item.level}">${escapeHtml(item.msg)}</span>
        `;
        container.appendChild(div);
      });

      if (autoScrollCheck.checked) {
        container.scrollTop = container.scrollHeight;
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function addLogEntry(entry) {
      allLogs.push(entry);
      if (allLogs.length > 2000) allLogs.shift();
      renderLogs();
    }

    // Cargar historial previo al iniciar
    ipcRenderer.invoke('logs:getHistory').then(history => {
      if (Array.isArray(history)) {
        allLogs = history;
        renderLogs();
      }
    }).catch(() => {});

    // Escuchar nuevos logs en tiempo real
    ipcRenderer.on('app:log', (event, entry) => {
      addLogEntry(entry);
    });

    searchInput.addEventListener('input', renderLogs);
    levelFilter.addEventListener('change', renderLogs);

    clearBtn.addEventListener('click', () => {
      allLogs = [];
      renderLogs();
    });

    copyBtn.addEventListener('click', () => {
      const text = allLogs.map(l => `${l.time} [${l.level.toUpperCase()}] ${l.msg}`).join('\n');
      navigator.clipboard.writeText(text).then(() => {
        copyBtn.textContent = '¡Copiado!';
        setTimeout(() => { copyBtn.textContent = 'Copiar'; }, 1500);
      });
    });
  </script>
</body>
</html>
